name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formato
        run: npx prettier --check "src/**/*.{ts,html,scss}"
      - name: Tests
        run: npm run test:ci
      - name: Build
        run: npm run build
