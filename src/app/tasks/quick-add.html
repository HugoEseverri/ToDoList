<form class="quick-add" [class.has-text]="text()" (submit)="$event.preventDefault(); submit()">
  <span class="plus" aria-hidden="true"><app-icon name="plus" [size]="16" /></span>
  <div class="field">
    <!--
      Sin espacios entre los fragmentos: cualquier espacio de más desalinearía el texto respecto
      del cursor del input. Por eso este bloque no se formatea.
    -->
    <!-- prettier-ignore -->
    <div #mirror class="mirror" aria-hidden="true">@for (segment of segments(); track $index) {<span [class]="segment.kind ? 'token token-' + segment.kind : null">{{ segment.text }}</span>}</div>
    <input
      #input
      class="input"
      type="text"
      autocomplete="off"
      spellcheck="false"
      enterkeyhint="done"
      [attr.aria-label]="t('quickAdd.label')"
      aria-describedby="quick-add-hint"
      [placeholder]="t('quickAdd.placeholder')"
      [value]="text()"
      (input)="onInput(input.value)"
      (scroll)="syncScroll()"
      (keyup)="syncScroll()"
      (keydown.escape)="onEscape()"
    />
  </div>
  @if (text().trim()) {
    <kbd class="enter-hint" aria-hidden="true">↵</kbd>
  } @else {
    <kbd class="focus-hint" aria-hidden="true">N</kbd>
  }
</form>

<div class="below" id="quick-add-hint" aria-live="polite">
  @if (chips().length) {
    <div class="chips">
      @for (chip of chips(); track chip.label) {
        <span class="chip enter" [class]="'chip-' + chip.kind">{{ chip.label }}</span>
      }
    </div>
  } @else if (!text()) {
    <p class="hint">
      {{ t('quickAdd.try') }} <span class="example">{{ t('quickAdd.example') }}</span>
    </p>
  }
</div>
