<div class="layout" [class.nav-open]="navOpen()">
  <app-sidebar class="sidebar" (navigate)="navOpen.set(false)" />
  <div class="scrim" aria-hidden="true" (click)="navOpen.set(false)"></div>

  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="icon-button"
        [attr.aria-label]="t('app.menu')"
        [attr.aria-expanded]="navOpen()"
        (click)="navOpen.set(true)"
      >
        <app-icon name="menu" [size]="18" />
      </button>
      <span class="topbar-brand">Hecho</span>
      <button
        type="button"
        class="icon-button"
        [attr.aria-label]="t('app.search')"
        (click)="dialogs.openPalette()"
      >
        <app-icon name="search" [size]="18" />
      </button>
    </header>

    <main>
      <router-outlet />
    </main>
  </div>
</div>

<app-task-detail />
<app-toast-outlet />
