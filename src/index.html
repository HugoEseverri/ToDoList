<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Hecho</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Hecho: gestor de tareas rápido, con carga en lenguaje natural, atajos de teclado y modo sin conexión."
    />
    <!-- Vista previa al compartir el link. Las redes piden URL absoluta: actualizar con el dominio final. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hecho — tareas en lenguaje natural" />
    <meta
      property="og:description"
      content="Escribís “Pagar la luz mañana 18hs #casa !alta” y Hecho entiende la fecha, la hora, la etiqueta y la prioridad."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar un parpadeo.
      try {
        var theme = localStorage.getItem('hecho.theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Hecho necesita JavaScript para funcionar.</noscript>
  </body>
</html>
